server {
    listen 80;
    server_name _;

    # Public-site security hardening
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api/lab-status/config {
        proxy_pass http://kuma.orange.lab/api/status-page/rock-solid-labs;
        proxy_set_header Host kuma.orange.lab;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /api/lab-status/heartbeat {
        proxy_pass http://kuma.orange.lab/api/status-page/heartbeat/rock-solid-labs;
        proxy_set_header Host kuma.orange.lab;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}
