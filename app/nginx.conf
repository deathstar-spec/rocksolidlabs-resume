server {
    listen 80;
    server_name _;

    # Public-site security hardening
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # HTTPS hardening
    add_header Strict-Transport-Security "max-age=2592000" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api/lab-status/config {
        proxy_pass http://kuma.orange.lab/api/status-page/rock-solid-labs;
        proxy_set_header Host kuma.orange.lab;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /api/lab-status/heartbeat {
        proxy_pass http://kuma.orange.lab/api/status-page/heartbeat/rock-solid-labs;
        proxy_set_header Host kuma.orange.lab;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}
