# Included by nginx.conf inside the http context.
map $uri $lab_status_allow {
    default "";
    /api/lab-status/config "GET, HEAD";
    /api/lab-status/heartbeat "GET, HEAD";
}

server {
    listen 80;
    server_name _;

    add_header Allow $lab_status_allow always;

    # Public-site security hardening
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # HTTPS hardening
    add_header Strict-Transport-Security "max-age=2592000" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api/lab-status/config {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://status-sanitizer:3000/api/lab-status/config;
        proxy_set_header Host status-sanitizer;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 7s;
    }

    location = /api/lab-status/heartbeat {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://status-sanitizer:3000/api/lab-status/heartbeat;
        proxy_set_header Host status-sanitizer;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 7s;
    }
}
